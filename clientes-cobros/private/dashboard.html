   const response=await fetch('api.php',{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':window.CUBO_SERVER_BOOT.csrf},...(body?{body}:{}),signal:controller.signal});

  let error;

   try{const result=await request('PUT',operation.body);accept(result,operation);return;}
   catch(e){error=e;if([401,409,413,415,422].includes(e.status))break;}
  }

   const latest=await request('GET');window.CUBO_SERVER_BOOT.serverToday=latest.serverToday;
   if(latest.revision!==revision){state=E.validate(latest.state);confirmed=JSON.stringify(state);revision=latest.revision;undoState=null;ui.selected.clear();if(ui.profile&&!state.clients.some(c=>c.id===ui.profile)){ui.view='clients';ui.profile=null;}render();if(force)closeModal();toast('Datos actualizados desde el servidor.');return true;}

function collectionPaymentMatches(p){

function collectionPeriodMatches(c){
 if(ui.collectionsPeriod==='all')return true;
 if(ui.collectionsPeriod==='undated')return ui.collectionState==='paid'?scopedPayments(c).length>0:!c.due;
 if(ui.collectionState==='paid')return scopedPayments(c).length>0;
 if(!c.due){if(!c.collectionWindow)return false;if(ui.collectionsPeriod==='month')return c.collectionWindow.start.slice(0,7)===ui.collectionsMonth;return !!ui.collectionsFrom&&!!ui.collectionsTo&&c.collectionWindow.end>=ui.collectionsFrom&&c.collectionWindow.start<=ui.collectionsTo;}
 if(ui.collectionsPeriod==='month')return c.due.slice(0,7)===ui.collectionsMonth;

function analytics(){let year=String(ui.analyticsYear),clients=state.clients.filter(c=>ui.analyticsChannel==='all'||c.channel===ui.analyticsChannel),ids=new Set(clients.map(c=>c.id));let ps=state.payments.filter(p=>{let q=charge(p.chargeId);return q&&!q.cancelled&&ids.has(q.clientId)&&E.payMXN(p)!==null&&((ui.analyticsMode==='cash'?p.date:q.period)||'').startsWith(year)});
 let ms=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`).filter(m=>m<=E.ym(state.settings.today));const series=ms.map(m=>ps.filter(p=>(ui.analyticsMode==='cash'?E.ym(p.date):charge(p.chargeId).period)===m).reduce((a,p)=>a+E.payMXN(p),0));let total=series.reduce((a,b)=>a+b,0),max=Math.max(...series,1),best=series.indexOf(Math.max(...series));let byType=Object.create(null),byChannel=Object.create(null);
 for(const p of ps){let q=charge(p.chargeId),s=service(q.serviceId),cl=client(q.clientId);byType[s.type]=(byType[s.type]||0)+E.payMXN(p);byChannel[cl.channel||'Sin dato']=(byChannel[cl.channel||'Sin dato']||0)+E.payMXN(p);}
 const years=[...new Set([ui.analyticsYear,...state.charges.map(c=>Number(c.period.slice(0,4))),...state.payments.filter(p=>p.date).map(p=>Number(p.date.slice(0,4)))])].sort();const activeMonths=series.filter(v=>v>0).length;
 let html=header('Analíticas','Cuánto recibes, qué servicios aportan y cómo cambia tu negocio.',false)+conversionNotice(state.payments.filter(p=>ids.has(charge(p.chargeId)?.clientId)&&charge(p.chargeId).period.startsWith(year)))+`<div class="toolbar"><select data-filter="analyticsYear" aria-label="Año de análisis">${years.map(v=>`<option ${v===ui.analyticsYear?'selected':''}>${v}</option>`).join('')}</select><select data-filter="analyticsMode" aria-label="Criterio de ingresos"><option value="cash" ${ui.analyticsMode==='cash'?'selected':''}>Por fecha de recepción</option><option value="period" ${ui.analyticsMode==='period'?'selected':''}>Por mes del servicio</option></select><select data-filter="analyticsChannel" aria-label="Canal de llegada">${['all',...new Set(state.clients.map(c=>c.channel||'Sin dato'))].map(ch=>`<option value="${esc(ch)}" ${ui.analyticsChannel===ch?'selected':''}>${ch==='all'?'Todos los canales':esc(ch)}</option>`).join('')}</select>${pill('≈ MXN · tasas registradas')}</div><div class="stat-grid"><div class="stat"><small>Total MXN con conversión registrada</small><strong>≈ ${N.format(total)}</strong></div><div class="stat"><small>Promedio · ${activeMonths} meses con ingresos</small><strong>≈ ${N.format(activeMonths?total/activeMonths:0)}</strong></div><div class="stat"><small>Mejor mes del periodo</small><strong>${total?months[best]:'Sin datos'}</strong></div></div><div class="grid2"><section class="card"><h2>Ingresos convertidos a MXN por mes</h2><p class="muted small" style="margin-top:6px">${ui.analyticsMode==='cash'?'Dinero recibido durante cada mes':'Pagos aplicados a cada periodo de servicio'}</p><div class="bar-chart" role="img" aria-label="${esc(ms.map((m,i)=>monthText(m)+': '+money(series[i])).join('; '))}">${ms.map((m,i)=>`<div class="bar-col" title="${esc(monthText(m)+': '+money(series[i]))}"><strong>${series[i]?shortMoney(series[i]):'0'}</strong><div class="bar ${i===best?'highlight':''}" style="height:${series[i]/max*80}%"></div><small>${months[i].slice(0,3)}</small></div>`).join('')}</div><p class="small muted">El mes en curso puede estar incompleto.</p></section><section class="card"><h2>Ingresos por servicio</h2>${bars(byType)}<p class="small muted">Importes de clientes registrados, sin descontar gastos.</p></section></div><div class="grid2" style="margin-top:20px"><details><summary>¿De dónde vienen mis clientes?</summary>${bars(byChannel)}${Object.keys(byChannel).map(ch=>`<p class="small muted">${esc(ch)}: ${clients.filter(c=>(c.channel||'Sin dato')===ch).length} clientes registrados</p>`).join('')}</details><details><summary>Duración, pausas y regresos</summary>${duration(clients)}<p class="small muted" style="margin-top:14px">Periodos activos de servicios recurrentes. Se muestran relaciones en curso y finalizadas por separado.</p></details></div><details style="margin-top:20px"><summary>Comparar el mismo mes entre años</summary>${compareYears(clients)}<p class="small muted">Una subida aislada no demuestra estacionalidad. Revisa varios años y cambios de clientes o precios.</p></details>`;return html;
}
function bars(obj){let arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]),max=Math.max(...arr.map(a=>a[1]),1);return arr.length?arr.map(([name,amount])=>`<div class="hbar"><div class="row"><strong>${esc(name)}</strong><span>${money(amount)}</span></div><div class="track"><b style="width:${amount/max*100}%"></b></div></div>`).join(''):'<p class="muted" style="margin:25px 0">Todavía no hay pagos en esta selección.</p>'}
function duration(cc){return cc.map(c=>{let ss=clientServices(c).filter(s=>s.kind==='recurring');if(!ss.length)return '';let days=new Set();for(const s of ss)for(const w of s.windows||[]){let end=w.end&&w.end<state.settings.today?w.end:state.settings.today;for(let d=w.start,n=0;d<end&&n<18000;d=E.dayAdd(d,1),n++)days.add(d);}return `<div class="payment-record"><div><strong>${esc(c.name)}</strong><div class="small muted">${c.status==='active'?'En curso':'Pausada o finalizada'} · ${ss.reduce((a,s)=>a+Math.max(0,(s.windows?.length||1)-1),0)} reactivaciones de servicio</div></div><strong>${N.format(E.round(days.size/30.44))} meses</strong></div>`}).join('')||'<p class="muted">No hay servicios recurrentes.</p>'}
function compareYears(cc){let ids=new Set(cc.map(c=>c.id)),ps=state.payments.filter(p=>ids.has(charge(p.chargeId).clientId)&&E.payMXN(p)!==null&&(ui.analyticsMode!=='cash'||p.date)),years=[...new Set(ps.map(p=>(ui.analyticsMode==='cash'?p.date:charge(p.chargeId).period).slice(0,4)))].sort();if(years.length<2)return '<p class="muted small">Necesitas pagos de al menos dos años para comparar temporadas.</p>';return `<div class="list-wrap"><table class="list-table"><thead><tr><th>Mes</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${months.map((m,i)=>`<tr><td>${m}</td>${years.map(y=>`<td>${money(ps.filter(p=>(ui.analyticsMode==='cash'?p.date:charge(p.chargeId).period).startsWith(y+'-'+String(i+1).padStart(2,'0'))).reduce((a,p)=>a+E.payMXN(p),0))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

 let body=`<form id="payment-form"><p class="muted small" style="margin-bottom:19px">${esc(client(c.clientId).name)} · ${esc(c.title)} · ${esc(monthText(c.period))}</p><div class="form-grid">${field('Monto recibido','amount',pay?.amount||bal,'number','min="0.01" step="0.01" required max="'+bal+'"')}${field('Moneda','currency',c.currency,'text','readonly')}${field('Fecha del pago','date',pay?.date||state.settings.today,'date','required max="'+state.settings.today+'"',true)}${textarea('Comprobante, referencia o nota · opcional','note',pay?.note||'')}</div><details style="margin-top:18px"><summary class="small">Tengo el importe exacto recibido en MXN</summary>${field('MXN exactos · opcional','mxn',pay?.mxn??'','number','min="0" step="0.01"')}<p class="small muted" style="margin-top:9px">Si lo dejas vacío, se usa la conversión aproximada. No se piden comisiones.</p></details><div class="info" id="balance-preview">Saldo disponible: ${money(bal,c.currency)}</div>${formButtons(pay?'Guardar corrección':'Guardar pago')}</form>`;

function syncServiceForm(){

 const amount=$('[name="amount"]');amount.parentElement.firstChild.textContent=k.value==='once'?'Precio total del proyecto *':'Importe mensual *';
 const fortnightly=k.value==='recurring'&&freq.value==='fortnightly';

 const first=$('[name="initial"]'),anniversary=cycle.value==='anniversary';
 if(anniversary&&first.value==='prorate')first.value='full';
 const prorate=first.querySelector('option[value="prorate"]');if(prorate)prorate.disabled=anniversary;

 const received=$('#received-choice').value;

function syncHistoricalClientForm(){const mode=$('[name="recordMode"]'),historical=mode?.value==='historical',section=$('#new-client-service-fields'),summaryWrap=$('#historical-summary-fields'),note=$('#historical-record-note');if(section){section.hidden=historical;for(const control of section.querySelectorAll('input,select,textarea'))control.disabled=historical;}if(summaryWrap){summaryWrap.hidden=!historical;const field=$('[name="historicalSummary"]');if(field){field.disabled=!historical;field.required=historical;}}if(note)note.hidden=!historical;const submit=$('#modal-body button[type="submit"]');if(submit&&mode)submit.textContent=historical?'Guardar ficha histórica':'Guardar cliente y primer cobro';}
function buildService(d,clientId){let s={id:E.uid(),clientId,name:String(d.get('serviceName')||'').trim(),type:d.get('type'),brand:String(d.get('brand')||''),site:String(d.get('site')||''),kind:d.get('kind'),amount:E.round(Number(d.get('amount'))),currency:d.get('currency'),start:d.get('start'),frequency:d.get('frequency')||'monthly',mode:d.get('mode'),cycle:d.get('frequency')==='fortnightly'?'calendar':d.get('cycle')||'calendar',dueDay:d.get('dueDay')?Number(d.get('dueDay')):null,dueDay2:Number(d.get('dueDay2')||28),initial:d.get('initial'),initialAmount:Number(d.get('initialAmount')),tariffs:[],windows:[]};
 if(!s.name||!Number.isFinite(s.amount)||s.amount<=0||s.amount>1e9||!E.validDate(s.start))throw Error('Completa el nombre, importe y fecha de inicio del servicio.');
 if(s.start>'2100-12-31'||s.start<'2000-01-01')throw Error('Selecciona una fecha entre 2000 y 2100.');
 if(s.kind==='recurring'&&s.initial==='custom'&&(!Number.isFinite(s.initialAmount)||s.initialAmount<=0))throw Error('Indica el importe inicial diferente.');
 if(s.kind==='recurring'&&s.frequency==='fortnightly'&&s.dueDay2<=s.dueDay)throw Error('El segundo día de pago debe ser posterior al primero.');
 if(s.kind==='recurring'){if(s.cycle==='anniversary')s.dueDay=Number(s.start.slice(8));s.schedulePending=s.frequency==='monthly'&&s.cycle==='calendar'&&s.dueDay===null;}
 s.windows=[{start:s.start,end:client(clientId)?.status==='active'?null:s.start}];state.services.push(s);
 if(s.kind==='once'){const dep=d.get('deposit')===''?null:Number(d.get('deposit'));if(dep!==null&&(!Number.isFinite(dep)||dep<=0||dep>=s.amount))throw Error('El anticipo debe ser mayor que cero y menor que el precio total.');let base={serviceId:s.id,clientId,period:E.ym(s.start),start:s.start,end:s.start,currency:s.currency,cancelled:false,lost:false};const due=d.get('oneDue')||null,final=d.get('finalDue')||null;if((due&&!E.validDate(due))||(final&&!E.validDate(final)))throw Error('Revisa las fechas del proyecto.');state.charges.push({...base,id:s.id+'_once1',amount:dep??s.amount,due,title:s.name+(dep?' · anticipo':''),part:'1'});if(dep)state.charges.push({...base,id:s.id+'_once2',amount:E.round(s.amount-dep),due:final,title:s.name+' · saldo al entregar',part:'2'});
 }else {
  // Only the explicitly created current period is manual. Future months are calendar rules.
  const m=E.ym(state.settings.today);
  if(s.frequency==='monthly'&&s.cycle==='calendar')s.automation={enabled:true,fromPeriod:E.monthAdd(m,1)>E.ym(s.start)?E.monthAdd(m,1):E.ym(s.start),collection:s.dueDay===null?{kind:'unknown'}:{kind:'day',day:s.dueDay}};
  if(client(clientId)?.status==='active'&&s.start<=state.settings.today){for(const q of s.schedulePending?[{...E.billingExpected(s,m),start:s.start>m+'-01'?s.start:m+'-01',amount:s.initial==='custom'?s.initialAmount:s.initial==='prorate'?E.round(s.amount*(Number(E.last(m).slice(8))-Number(s.start.slice(8))+1)/Number(E.last(m).slice(8))):s.amount}]:E.expected(s,m))state.charges.push({...q,id:s.id+'_'+m+'_'+q.part,clientId,serviceId:s.id,title:s.name,period:m,currency:s.currency,cancelled:false,lost:false,registration:'manual-current-period'});}
 }
 if(d.get('received')&&d.get('received')!=='no'){const first=state.charges.find(c=>c.serviceId===s.id);if(!first)throw Error('Para registrar el pago inicial, el servicio debe estar activo y haber iniciado en el mes actual o antes.');E.addPayment(state,first.id,d.get('received')==='full'?first.amount:Number(d.get('receivedAmount')),d.get('paymentDate'),d.get('paymentNote'));}
 return s;
}

 openModal(title,html,async f=>{const d=new FormData(f);let id=clientId;const historical=!clientId&&d.get('recordMode')==='historical';await mutate(()=>{if(!id){id=E.uid();let c={id,status:historical?'inactive':'active',createdAt:state.settings.today};for(const k of ['name','contact','phone','email','country','category','channel','referral','dni','notes'])c[k]=String(d.get(k)||'').trim();if(historical){const summary=String(d.get('historicalSummary')||'').trim();if(!summary)throw Error('Añade el resumen del antecedente. No se crearán fechas ni cobros.');c.notes=[summary,c.notes].filter(Boolean).join('\n\n');}if(!c.name)throw Error('Indica el nombre del cliente.');state.clients.push(c);}if(historical){history(id,'Ficha histórica sin fechas ni cobros. '+String(d.get('historicalSummary')||'').trim());}else{const s=buildService(d,id);history(id,'Servicio creado: '+s.name+' · '+money(s.amount,s.currency));}},historical?'Ficha histórica guardada sin fechas ni cobros':'Cliente y acuerdo guardados');closeModal();if(ui.expanded)leaveExpanded();ui.profile=id;ui.view='profile';render();},true);syncServiceForm();syncHistoricalClientForm();}

}).join('');}

 openModal('Calendario automático',`<form><p class="info">${esc(client(s.clientId).name)} · ${esc(s.name)}. Meses calendario completos; no cambia cobros existentes. Se ejecuta al abrir la herramienta.</p><div class="form-grid">${sel('Generación futura','enabled',[['yes','Activa'],['no','Pausada']],a.enabled?'yes':'no')}${field('Primer mes futuro autorizado','fromPeriod',a.fromPeriod,'month','required min="2026-11"')}${sel('Modalidad','mode',[['advance','Adelantado'],['arrears','Mes vencido']],s.mode)}${sel('Cobro','collection',[['unknown','Día desconocido · sin vencimiento'],['day','Día exacto del mes correspondiente'],['previous_day','Día del mes anterior · cubre mes siguiente'],['window','Ventana del mes siguiente · sin vencimiento']],r.kind)}${field('Día exacto · solo si está confirmado','day',r.day||'','number','min="1" max="31"')}${field('Inicio de ventana','startDay',r.startDay||'','number','min="1" max="31"')}${field('Fin de ventana','endDay',r.endDay||'','number','min="1" max="31"')}</div><p class="small muted">La ventana y el vencimiento no se combinan. No escribas un día aproximado. Si el día no se conoce, selecciona “Día desconocido”. Los grupos existentes de pagador se conservan.</p>${formButtons('Guardar calendario')}</form>`,async f=>{const d=new FormData(f);await mutate(()=>{const v=service(id),kind=d.get('collection'),from=d.get('fromPeriod');if(from<E.monthAdd(E.ym(state.settings.today),1)&&from!==v.automation?.fromPeriod)throw Error('El inicio debe ser futuro; no se reconstruyen meses anteriores.');const collection={kind};if(['day','previous_day'].includes(kind))collection.day=Number(d.get('day'));if(kind==='window'){collection.startDay=Number(d.get('startDay'));collection.endDay=Number(d.get('endDay'));}v.mode=d.get('mode');v.automation={...v.automation,enabled:d.get('enabled')==='yes',fromPeriod:from,collection};v.dueDay=collection.day||null;v.schedulePending=v.dueDay===null;E.validate(state);history(v.clientId,'Calendario futuro actualizado; no cambia movimientos existentes.');},'Calendario guardado');closeModal();});
}
function editService(id){let s=service(id);openModal('Editar acuerdo del servicio',`<form><div class="form-grid">${field('Nombre del servicio','name',s.name,'text','required')}${sel('Tipo','type',['SEO','Web','Ads','Contenido','Consultoría','Otro'],s.type)}${field('Marca / proyecto','brand',s.brand||'')}${field('Sitio web','site',s.site||'')}${s.kind==='recurring'&&!s.automation?sel('Modalidad','mode',[['advance','Adelantado'],['arrears','A mes vencido']],s.mode)+field('Día de pago · mes calendario','dueDay',s.dueDay??'','number','min="1" max="31" '+(s.schedulePending?'':'required'))+(s.frequency==='fortnightly'?field('Segundo día de pago','dueDay2',s.dueDay2,'number','min="1" max="31" required'):''):''}</div><div class="info">Los cambios de fecha se usarán en los nuevos meses. Para ajustar un cobro ya creado, abre su casilla y usa “Editar cobro”. El precio se cambia desde “Cambiar tarifa”.</div>${formButtons('Guardar acuerdo')}</form>`,async f=>{let d=new FormData(f);await mutate(()=>{s=service(id);for(const k of ['name','type','brand','site'])s[k]=String(d.get(k)||'').trim();if(s.kind==='recurring'&&!s.automation){s.mode=d.get('mode');s.dueDay=d.get('dueDay')?Number(d.get('dueDay')):null;s.schedulePending=s.dueDay===null;if(s.frequency==='fortnightly'){s.dueDay2=Number(d.get('dueDay2'));if(s.dueDay2<=s.dueDay)throw Error('La segunda fecha debe ser posterior a la primera.');}}history(s.clientId,'Acuerdo actualizado: '+s.name);},'Acuerdo guardado');closeModal();});}
function manualModal(id=null){if(id)return addClientOrService(id,true);openModal('Añadir un cobro puntual',`<form>${sel('Cliente','clientId',state.clients.map(c=>[c.id,c.name]),state.clients[0]?.id)}<p class="info">Crea un proyecto de una sola vez o un trabajo adicional. No se repetirá cada mes.</p>${formButtons('Continuar')}</form>`,f=>addClientOrService(new FormData(f).get('clientId'),true));}
function batchPay(){let ids=[...ui.selected].filter(id=>charge(id)&&['overdue','pending'].includes(E.status(state,charge(id))));if(!ids.length)return toast('Selecciona cobros pendientes.');openModal('Confirmar '+ids.length+' pagos',`<form><div class="stack">${ids.map(id=>{let c=charge(id);return `<div class="row between"><span>${esc(client(c.clientId).name)}<small class="muted" style="display:block">${esc(c.title)} · ${esc(monthText(c.period))}</small></span><strong>${money(E.balance(state,c),c.currency)}</strong></div>`}).join('')}</div><div style="margin-top:22px">${field('Fecha de recepción para estos pagos','date',state.settings.today,'date','required max="'+state.settings.today+'"')}</div>${formButtons('Confirmar pagos')}</form>`,async f=>{let date=new FormData(f).get('date');await mutate(()=>{for(const id of ids){let c=charge(id);E.addPayment(state,id,E.balance(state,c),date);history(c.clientId,'Pago completo registrado por lote: '+c.title);}},'Pagos registrados');ui.selected.clear();closeModal();render();});}
function confirmAction(title,text,run,label='Confirmar'){openModal(title,`<form><p>${esc(text)}</p>${formButtons(label)}</form>`,async()=>{await run();closeModal();});}
function syncSettingsForm(){const mode=$('#date-mode-choice'),date=$('#modal-body [name="today"]');if(!mode||!date)return;date.closest('.field').hidden=mode.value==='real';date.disabled=mode.value==='real';}
function settings(){openModal('Ajustes',`<form><div class="form-section">FECHA PARA COBROS</div><p class="info">Fecha automática según la zona horaria configurada en el servidor.</p><div class="info">Los periodos se abren con la fecha del servidor al entrar o mientras la herramienta está abierta.</div><div class="form-section">CONVERSIÓN APROXIMADA A MXN</div><div class="form-grid">${field('1 USD equivale a MXN','usd',state.settings.rates.USD,'number','required min="0.0001" step="0.0001"')}${field('1 EUR equivale a MXN','eur',state.settings.rates.EUR,'number','required min="0.0001" step="0.0001"')}${field('Fecha de estas tasas','rateDate',state.settings.rateDate,'date','required')}</div><p class="small muted" style="margin:14px 0">Tasas manuales, sin cotización en vivo. Los pagos anteriores conservan su conversión. Puedes registrar los MXN exactos al recibir un pago.</p>${formButtons('Guardar ajustes')}</form><div class="divider"></div><h3>Copias de tus datos</h3><p class="small muted" style="margin-top:7px">Los registros se guardan en el servidor. Exporta una copia adicional para conservarla fuera del hosting.</p><div class="settings-footer">${act('Exportar copia JSON','export')}${act('Importar copia','import')}</div>`,async f=>{
 const d=new FormData(f);await mutate(()=>{
  const mode=d.get('dateMode')||state.settings.dateMode,next=mode==='real'?E.localToday():d.get('today');
  if(!['real','simulation'].includes(mode)||!E.validDate(next))throw Error('Selecciona una fecha y modo válidos.');
  if(mode==='simulation'&&next<state.settings.today)throw Error('La simulación solo puede avanzar. Restaura los ejemplos para volver al inicio.');
  if(state.payments.some(p=>p.date>next))throw Error('Hay pagos posteriores a esa fecha. Para probar con la fecha actual, usa Empezar sin ejemplos o corrige los pagos futuros.');
  const usd=Number(d.get('usd')),eur=Number(d.get('eur'));if(!Number.isFinite(usd)||!Number.isFinite(eur)||usd<=0||eur<=0)throw Error('Revisa las tasas.');
  if(!E.validDate(d.get('rateDate')))throw Error('Selecciona una fecha de tasas válida.');
  state.settings.dateMode=mode;state.settings.today=next;state.settings.rates={MXN:1,USD:usd,EUR:eur};state.settings.rateDate=d.get('rateDate');clockProblem='';E.generate(state);
  ui.year=Number(next.slice(0,4));ui.month=E.ym(next);ui.collectionsMonth=E.ym(next);ui.analyticsYear=ui.year;
 },'Ajustes guardados');closeModal();},true);syncSettingsForm();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cubo-seo-cobros-'+state.settings.today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Copia exportada. Incluye todos los clientes y pagos.');}
function help(){openModal('Cómo usar la herramienta',`<div class="stack"><p>Vista universal: revisar meses y registrar pagos. Cobros: consultar pendientes y recibidos. Clientes: gestionar acuerdos y trabajos. Analíticas: revisar los resultados de esos mismos registros.</p><p>Los datos se guardan en el servidor y se actualizan entre tus dispositivos. Cada operación se confirma antes de mostrarse como guardada. Si hay cambios desde otro dispositivo, actualiza y vuelve a realizar la operación.</p><p>Las tasas de cambio son manuales. Los pagos anteriores conservan su conversión. La fecha de trabajo sigue la zona horaria configurada en el servidor.</p><p>Exporta una copia JSON periódicamente y consérvala fuera del hosting. Importar reemplaza los datos compartidos y genera una versión anterior para recuperación.</p><p>Un agente autorizado puede usar estos mismos formularios desde el navegador. Esta aplicación no llama a la API de OpenAI.</p></div>`);}

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!dialog.open&&ui.expanded){ev.preventDefault();leaveExpanded();}});
document.addEventListener('toggle',ev=>{if(ev.target.isConnected&&ev.target.dataset?.openKey)ui[ev.target.dataset.openKey]=ev.target.open;if(ev.target.isConnected&&ev.target.classList?.contains('collection-extra'))ui.moreCollectionFilters=ev.target.open;},true);
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;try{if(ServerStorage.isBusy())return;await actions[el.dataset.action]?.(el);}catch(e){dialog.open?errorModal(e.message):toast(e.message);}});
document.addEventListener('input',ev=>{if(ev.target.dataset.filter==='query'){let input=ev.target,start=input.selectionStart;ui.query=input.value;render();const next=$('#search');if(next){next.focus();next.setSelectionRange(start,start);}}if(ev.target.closest('#modal-body')&&['amount','start'].includes(ev.target.name))syncServiceForm();});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.filter){const k=el.dataset.filter;if(k==='cardMonth'){ui.month=ui.year+'-'+el.value;render();restoreFilterFocus(k);return;}if(k==='collectionsYear'||k==='collectionsMonthNumber'){ui.collectionsMonth=k==='collectionsYear'?el.value+ui.collectionsMonth.slice(4):ui.collectionsMonth.slice(0,5)+el.value;ui.selected.clear();render();restoreFilterFocus(k);return;}ui[k]=['year','analyticsYear'].includes(k)?Number(el.value):el.value;ui.selected.clear();render();restoreFilterFocus(k);}if(el.dataset.select){el.checked?ui.selected.add(el.dataset.select):ui.selected.delete(el.dataset.select);render();}if(el.closest('#modal-body')){syncServiceForm();syncHistoricalClientForm();syncClientStatusForm();syncSettingsForm();}});

dialog.addEventListener('click',ev=>{if(ev.target===dialog){const r=dialog.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeModal();}});

function registerTools(){const ctx=document.modelContext;if(!ctx?.registerTool)return;
 const tools=[{name:'read_cubo_collections',title:'Consultar cobros de Cubo SEO',description:'Devuelve saldos y estados actuales sin modificar registros.',inputSchema:{type:'object',properties:{status:{type:'string',enum:['all','paid','pending','overdue','lost']}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).some(k=>k!=='status')||(input.status&&!['all','paid','pending','overdue','lost'].includes(input.status)))throw Error('Estado no válido.');return state.charges.filter(c=>!c.cancelled&&(!input.status||input.status==='all'||E.status(state,c)===input.status)).map(c=>({id:c.id,client:client(c.clientId).name,period:c.period,currency:c.currency,balance:E.balance(state,c),due:c.due,status:E.status(state,c),type:'dated_charge'})).concat(state.clients.filter(c=>c.opening).map(c=>{const o=c.opening,known=['debt','contract'].includes(o.kind);return {id:c.id+'_opening',client:c.name,type:'opening',kind:o.kind,period:null,currency:o.currency,total:o.total,received:known?E.openingPaid(o):null,balance:known?E.openingBalance(o):o.kind==='prepaid_unknown'?0:null,due:null,date:null,status:known?(E.openingBalance(o)?'pending':'paid'):'unknown'};}).filter(o=>!input.status||input.status==='all'||o.status===input.status));}},{name:'open_cubo_payment_form',title:'Abrir formulario de pago',description:'Abre el formulario de un cobro existente. No registra ni confirma el pago.',inputSchema:{type:'object',properties:{chargeId:{type:'string'}},required:['chargeId'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input.chargeId!=='string'||Object.keys(input).some(k=>k!=='chargeId')||!charge(input.chargeId))throw Error('Cobro no encontrado.');paymentModal(input.chargeId);return {opened:true,chargeId:input.chargeId,paymentRecorded:false};}}];
